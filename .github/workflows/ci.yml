name: CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json

      - name: Install web deps
        run: npm install --prefix apps/web

      - name: Lint web
        run: npm run lint:web

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Test web
        run: npm run test:web

      - name: Build web
        run: npm run build:web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt -r services/agent/requirements.txt

      - name: Run Python tests
        env:
          PYTHONPATH: services/api/src:services/agent/src
          HYTHERE_ALLOW_LOCAL_DEV_AUTH: true
        run: pytest services/api/tests services/agent/tests
